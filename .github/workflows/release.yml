name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Deploy
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: wp-cli
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Generate .pot file
        run: wp i18n make-pot . languages/samplehq-request-form.pot --slug=samplehq-request-form

      - name: Build distribution zip
        run: |
          mkdir -p build/samplehq-request-form
          rsync -rc --exclude-from=.distignore . build/samplehq-request-form/
          cd build && zip -r samplehq-request-form.zip samplehq-request-form/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          files: build/samplehq-request-form.zip
          generate_release_notes: true

      - name: Warn if SVN credentials missing
        if: ${{ secrets.SVN_USERNAME == '' }}
        run: echo "::warning::SVN_USERNAME secret not set — skipping WordPress.org deploy"

      - name: Deploy to WordPress.org
        if: ${{ secrets.SVN_USERNAME != '' }}
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: samplehq-request-form
          BUILD_DIR: build/samplehq-request-form
          ASSETS_DIR: .wordpress-org
